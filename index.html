  <head>

    <title>Terra — Serve ministries from anywhere</title>

    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-startup-image" href="/splash/splash-812x375@3x-landscape.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-414x896@3x-portrait.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-896x414@3x-landscape.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-414x896@2x-portrait.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-896x414@2x-landscape.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />

    <link rel="apple-touch-startup-image" href="/splash/splash-667x375@2x-landscape.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />

    <link rel="apple-touch-startup-image" href="/splash/splash-1366x1024@2x-landscape.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />

    <link rel="stylesheet" href="/src/styles/chrome.css" />
    <link rel="stylesheet" href="/src/styles/globe.css" />
    <link rel="stylesheet" href="/src/styles/panel.css" />
    <link rel="stylesheet" href="/src/styles/board.css" />
    <link rel="stylesheet" href="/src/styles/modal.css" />
    <link rel="stylesheet" href="/src/styles/auth.css" />
    <link rel="stylesheet" href="/src/styles/forms.css" />
  </head>
  <body>
    <!-- watercolour ground, painted behind everything -->
    <div class="paper" aria-hidden="true"></div>

    <!-- hero stands in front of the globe and retires once you engage with it -->
    <div class="hero" id="hero" aria-hidden="true">
      <div class="hero__eyebrow"><i></i><span id="heroCount">Ministries around the world</span></div>
      <!-- Word by word, so each can land on its own beat (base.css, "word-in").
           "anywhere." is three layers: a moving glow behind, a white outline,
           and the coloured word itself on top. The glow sits outside the
           moving word, whose filter would otherwise cut it off at its box. -->
      <h1 class="hero__title">
        <span class="hero__line"><span class="hero__word" style="--i: 0">Serve</span> <span class="hero__word" style="--i: 1">ministries</span></span>
        <span class="hero__line"><span class="hero__word" style="--i: 2">from</span> <span class="hero__any"><span class="hero__aura" aria-hidden="true"></span><span class="hero__word" style="--i: 3"><span class="hero__stroke" data-text="anywhere." aria-hidden="true"></span><span class="hero__mark">anywhere.</span></span></span></span>
      </h1>
    </div>

    <canvas id="globe" aria-label="Globe of ministries and their open needs" role="img"></canvas>

    <!-- projected city / country / pin labels -->
    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <div class="chrome">
      <header class="topbar">
        <a class="brand" href="#" data-action="reset-view" title="Back to the whole globe">
          <span class="brand__name">Terra</span>
          <span class="brand__sep">/</span>
          <span class="brand__product">Online help for ministries</span>
        </a>

        <nav class="nav" id="nav">
          <button class="nav__item is-active" data-view="globe">Globe</button>
          <button class="nav__item" data-view="needs">Needs</button>
          <button class="nav__item" data-view="about">About</button>
        </nav>

        <div class="topbar__actions">
          <button class="btn btn--accent" data-action="post-need">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" /></svg>
            Post a need
          </button>
          <button class="btn btn--ghost locate-btn" data-action="near-me" aria-label="Show where I am" title="Show where I am">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.4 2.6 2.6 7.1l4.5 1.8 1.8 4.5Z" /></svg>
          </button>
          <button class="btn btn--icon" data-action="menu" aria-label="More" id="menuBtn">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="3.2" cy="8" r="1.35" /><circle cx="8" cy="8" r="1.35" /><circle cx="12.8" cy="8" r="1.35" />
            </svg>
          </button>
        </div>
      </header>

      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

      <div class="findbar">
        <div class="search" id="search">
          <svg class="search__ico" viewBox="0 0 18 18" aria-hidden="true">
            <circle cx="7.6" cy="7.6" r="5.4" /><path d="M11.6 11.6 15.8 15.8" />
          </svg>
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search needs, ministries, skills or places"
          />
          <button class="search__clear" id="searchClear" aria-label="Clear search" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2" /></svg>
          </button>
          <!-- Landing screen only: takes the search into the globe, as Enter does. -->
          <button class="search__go" id="searchGo" aria-label="Search">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10h11M11 5.5l4.5 4.5-4.5 4.5" /></svg>
          </button>
          <!-- Phone only: the account, inside the field, where a map app keeps it. -->
          <span class="search__me" id="searchMe"></span>
          <div class="suggest pop" id="suggest" hidden></div>
        </div>
        <div class="filters" id="filters"></div>
      </div>

      <!-- Every tile provider requires this while its imagery is on screen.
           A sibling of the dial rather than a child of it: the dial is a mouse
           affordance and is hidden on phones, and an attribution that is only
           shown to people with a mouse is not an attribution. -->
      <p class="credit" id="credit" hidden></p>

      <div class="dial" id="dial">
        <button class="dial__btn" data-action="zoom-in" aria-label="Zoom in">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5.2v9.6M5.2 10h9.6" /></svg>
        </button>
        <button class="dial__btn" data-action="zoom-out" aria-label="Zoom out">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.2 10h9.6" /></svg>
        </button>
        <button class="dial__btn" data-action="reset-view" aria-label="Reset the view">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M15.4 8.2A5.8 5.8 0 1 0 15.9 12" /><path d="M15.9 4.6v3.8h-3.8" />
          </svg>
        </button>
        <button class="dial__btn" data-action="about" aria-label="About this map">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="7.2" /><path d="M10 9v5.1" /><circle cx="10" cy="6.4" r=".95" class="ico__solid" />
          </svg>
        </button>
      </div>

      <div class="hint" id="hint">drag to rotate · zoom for cities · click a pin</div>

      <!-- Phone only (chrome.css, "phone"): the globe is the page, with a dock
           of the few things to do along the bottom and round map controls
           beside it, the way a map app on a phone is laid out. -->
      <nav class="dock" id="dock" aria-label="Main">
        <button class="dock__btn" data-action="reset-view" title="Back to the whole globe">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="6.6" /><path d="M3.4 10h13.2M10 3.4c-1.9 1.8-2.9 4-2.9 6.6s1 4.8 2.9 6.6c1.9-1.8 2.9-4 2.9-6.6s-1-4.8-2.9-6.6" />
          </svg>
          <span>Globe</span>
        </button>
        <button class="dock__btn" data-action="open-board">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.5h12M4 10h12M4 14.5h7.5" /></svg>
          <span>Needs</span>
        </button>
        <button class="dock__btn" data-action="post-need">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11" /></svg>
          <span>Post</span>
        </button>
        <button class="dock__btn" data-action="join" id="dockJoin">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="8.4" cy="7" r="3" /><path d="M2.8 16.2c.7-3 2.9-4.6 5.6-4.6s4.9 1.6 5.6 4.6M15.6 5.6v5M13.1 8.1h5" />
          </svg>
          <span>Join</span>
        </button>
        <button class="dock__btn" data-action="menu" aria-label="More">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="4.6" cy="10" r="1.45" class="ico__solid" /><circle cx="10" cy="10" r="1.45" class="ico__solid" /><circle cx="15.4" cy="10" r="1.45" class="ico__solid" />
          </svg>
          <span>More</span>
        </button>
      </nav>

      <div class="fabs" id="fabs">
        <button class="fab" data-action="near-me" aria-label="Fly to where you are">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.4 3.6 3.6 8.9l5.3 2.2 2.2 5.3Z" /></svg>
        </button>
        <button class="fab" data-action="toggle-filters" id="filtersBtn" aria-label="Filter needs" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5h13M6 10h8M8.6 15h2.8" /></svg>
        </button>
      </div>

      <aside class="panel" id="panel"></aside>
      <div class="sheet" id="sheet"></div>
      <button class="grabber" id="grabber">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.2h10M3 8h10M3 11.8h6.5" /></svg>
        See needs board
      </button>
    </div>

    <div class="modals" id="modals"></div>
    <div class="toasts" id="toasts"></div>

    <noscript>
      <p style="padding: 40px; font: 16px system-ui">Terra needs JavaScript and WebGL2 to draw the globe.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
